name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ['**']

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4
        with:
          # jsdom 27 (via html-encoding-sniffer -> @exodus/bytes) requires
          # Node's synchronous require(esm) support, only available on
          # ^20.19.0 || ^22.12.0 || >=24.0.0. Node 18 fails test:unit with
          # "require() of ES Module ... not supported".
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
